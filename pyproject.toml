[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular RAG MCP server for personal knowledge management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "rag", "retrieval", "knowledge-base"]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "reportlab>=4,<5",
]
providers = [
    "openai>=2.54,<3",
    "google-genai>=2.29,<3",
]
splitters = [
    "langchain-text-splitters>=1.1.3,<2",
]
vector-stores = [
    "chromadb>=1.5.9,<2",
]
sparse = [
    "jieba>=0.42.1,<1",
]
mcp = [
    "mcp>=1.26,<2",
    "jsonschema>=4.20,<5",
]
dashboard = [
    "streamlit>=1.50,<2",
]
evaluation = [
    "ragas==0.4.3",
    "langchain-community==0.4.1",
]
rerankers = [
    "sentence-transformers>=3,<6",
]
vision = [
    "Pillow>=10,<13",
]
loaders = [
    "markitdown[pdf]>=0.1,<1",
    "PyMuPDF>=1.26,<2",
    "markdown-it-py>=4,<5",
    "Pillow>=10,<13",
]

[project.scripts]
mcp-server = "src.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: 快速单元测试，不依赖外部系统",
    "integration: 多个模块或 adapter 的集成测试",
    "e2e: 从入口到结果的端到端测试",
    "llm: 需要真实模型调用的测试",
    "slow: 不适合频繁执行的慢测试",
]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
